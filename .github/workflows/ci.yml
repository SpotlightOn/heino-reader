name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # QtWebEngine needs a set of system libraries even on the offscreen
      # platform used by the test suite.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libfontconfig1 \
            libglib2.0-0 libnss3 libxcomposite1 libxdamage1 libxrandr2 \
            libasound2t64 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libgbm1 libpango-1.0-0 libcairo2 libxkbcommon-x11-0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tests (pytest)
        run: uv run pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"
          QTWEBENGINE_DISABLE_SANDBOX: "1"
