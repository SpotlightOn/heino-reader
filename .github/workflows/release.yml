name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
      - name: Build executable
        run: >
          pyinstaller --noconfirm --clean --windowed --onefile
          --name heinoreader --paths src --collect-all heinoreader main.py
      - uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: dist/heinoreader.exe
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26-intel
            arch: x86_64
          - runner: macos-latest
            arch: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
      - name: Build .app bundle
        run: >
          pyinstaller --noconfirm --clean --windowed --onefile
          --name heinoreader --target-arch ${{ matrix.arch }}
          --paths src --collect-all heinoreader main.py
      - name: Package .app as zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent \
            dist/heinoreader.app "heinoreader-${VERSION}-macos-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: "*.zip"
          if-no-files-found: error

  linux:
    name: Linux (AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libfontconfig1 \
            libglib2.0-0 libnss3 libxcomposite1 libxdamage1 libxrandr2 \
            libasound2t64 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libgbm1 libpango-1.0-0 libcairo2 libxkbcommon-x11-0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
      - name: Build bundle (PyInstaller, onedir)
        run: >
          pyinstaller --noconfirm --clean
          --name heinoreader --paths src --collect-all heinoreader main.py
      - name: Assemble AppDir
        run: |
          set -eux
          mkdir -p AppDir/usr/bin \
                   AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/256x256/apps
          # PyInstaller's onedir output is relocatable ($ORIGIN/_internal)
          cp -a dist/heinoreader/. AppDir/usr/bin/
          cp heinoreader.desktop AppDir/heinoreader.desktop
          # Render the app icon to PNG via PySide6 (already installed):
          QT_QPA_PLATFORM=offscreen python -c "from PySide6.QtCore import QRectF; from PySide6.QtGui import QColor, QImage, QPainter; from PySide6.QtSvg import QSvgRenderer; img = QImage(256, 256, QImage.Format.Format_ARGB32); img.fill(QColor(0, 0, 0, 0)); p = QPainter(img); QSvgRenderer(open('src/heinoreader/icon.svg', 'rb').read()).render(p, QRectF(0, 0, 256, 256)); p.end(); img.save('AppDir/heinoreader.png')"
          cp AppDir/heinoreader.png \
            AppDir/usr/share/icons/hicolor/256x256/apps/heinoreader.png
          cp AppDir/heinoreader.png AppDir/.DirIcon
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/heinoreader" "$@"
          EOF
          chmod +x AppDir/AppRun
      - name: Build AppImage
        run: |
          set -eux
          curl -L -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          VERSION="${GITHUB_REF_NAME#v}"
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 VERSION="$VERSION" \
            ./appimagetool AppDir "heinoreader-${VERSION}-x86_64.AppImage"
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: "*.AppImage"
          if-no-files-found: error

  release:
    name: Publish release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**
          generate_release_notes: true
