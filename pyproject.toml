[project]
name = "heino-reader"
version = "0.2.0"
description = "A fast document viewer for markdown files, built with PySide6"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "markdown-it-py>=4.2.0",
    "pygments>=2.21.0",
    "PySide6>=6.6,<6.12",
]

[project.scripts]
heinoreader = "heinoreader:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heinoreader"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "ruff>=0.17.2",
]
